
controlLoopRate: 100.0;           # Hz
ctrlMode: 1;                    # 0=ThrusterMapping, 1=classicPidControl, 2=ComputedTorque, 3=Forces
enableThrusters: true;
thrusterPercLimit: 100.0;        # percent

# input saturation limits
surgeMin: -2.0;
surgeMax: 2.0;    # Be careful to make the PID Surge saturation smaller than this values !
swayMin: -2.0;
swayMax: 2.0;
heaveMin: -2.0;
heaveMax: 2.0;
rollRateMin: -0.2;
rollRateMax: 0.2;
pitchRateMin: -0.2;
pitchRateMax: 0.2;
yawRateMin: -0.2;
yawRateMax: 0.2;  # Be careful to make the PID Heading saturation smaller than this values !

thrusterMapping:
{
    pidSurge:
    {
        kp: 1.0;
        ki: 0.4;
        kd: 0.0;
        kff: 0.6;
        n: 10.0;
        tr: 0.5;
        sat: 2.5;
    };
};

classicPidControl:
{
    pidSurge:
    {
        kp: 3.0
        ki: 0.2;
        kd: 2.5;
        kff: 0.6;
        n: 10.0;
        tr: 0.5;
        sat: 2.0;
    };

    pidSway:
    {
        kp: 3.0
        ki: 0.2;
        kd: 2.5;
        kff: 0.6;
        n: 10.0;
        tr: 0.5;
        sat: 2.0;
    };

    pidHeave:
    {
        kp: 3.0
        ki: 0.2;
        kd: 0.5;
        kff: 0.6;
        n: 10.0;
        tr: 0.5;
        sat: 2.0;
    };

    pidRollRate:
    {
        kp: 4.0;#1000.0;
        ki: 0.3;#400.0;
        kd: 0.5;
        kff: 0.0;
        n: 10.0;
        tr: 0.5;
        sat: 560.0;
     };

    pidPitchRate:
    {
        kp: 4.0;#1000.0;
        ki: 0.3;#400.0;
        kd: 1.0;
        kff: 0.0;
        n: 10.0;
        tr: 0.5;
        sat: 560.0;
     };

     pidYawRate:
     {
        kp: 2.0;#1000.0;
        ki: 0.1;#400.0;
        kd: 0.5;
        kff: 0.0;
        n: 10.0;
        tr: 0.5;
        sat: 560.0;
      };
};

